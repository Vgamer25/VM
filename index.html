<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>Browser VM</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }

        #app {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
        }

        #display {
            display: block;

            width: 100%;
            height: 100%;

            background: #000;

            image-rendering: auto;

            outline: none;

            cursor: default;
        }

        #loading {
            position: absolute;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #050505;
            color: white;

            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            font-size: 18px;

            z-index: 10;
        }

        #error {
            position: absolute;
            inset: 0;

            display: none;

            padding: 30px;

            background: #080808;
            color: #ff6b6b;

            font-family: monospace;
            white-space: pre-wrap;

            overflow: auto;

            z-index: 20;
        }
    </style>
</head>

<body>

<div id="app">

    <div id="loading">
        Starting Linux VM...
    </div>

    <canvas
        id="display"
        tabindex="0"
        aria-label="Linux virtual machine display"
    ></canvas>

    <pre id="error"></pre>

</div>

<script type="module" src="./vm.js"></script>

</body>
</html>
